name: Build AAPT2 (Android 17 / API 37)

on:
  workflow_dispatch:
    inputs:
      aosp_tag:
        description: "Tag AOSP untuk semua submodule"
        default: "android-17.0.0_r1"
        required: true

jobs:
  build:
    name: Build ${{ matrix.target_arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_arch: [arm64-v8a, armeabi-v7a, x86_64, x86]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Bump submodules to AOSP tag
        env:
          TAG: ${{ inputs.aosp_tag }}
        run: |
          set -uo pipefail
          for dir in submodules/*/; do
            name=$(basename "$dir")
            if git -C "$dir" fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
              git -C "$dir" checkout -q "tags/$TAG"
              echo "OK    $name -> $TAG"
            else
              echo "MISS  $name (tag $TAG tidak ada, tetap di commit lama)"
            fi
          done
          sed -i 's/PLATFORM_TOOLS_VERSION ".*"/PLATFORM_TOOLS_VERSION "37.0.0"/' misc/platform_tools_version.h
          echo "--- Versi protoc yang diminta protobuf submodule (workflow memakai 21.12):"
          grep PROTOC_VERSION submodules/protobuf/protobuf_version.bzl || echo "(tidak ditemukan)"

      - name: Get protoc
        run: |
          wget https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          sudo unzip -j protoc-*.zip bin/protoc -d /usr/local/bin/

      - name: Apply patch
        run: ./patch.sh

      - name: Drop sources missing in this AOSP version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          pattern = re.compile(r'^\s*\$\{SRC\}/(\S+\.(?:c|cc|cpp|S|asm))\s*$')
          for cmake_file in sorted(pathlib.Path("cmake").glob("*.cmake")):
              kept = []
              for line in cmake_file.read_text().splitlines(keepends=True):
                  match = pattern.match(line)
                  if match and not os.path.isfile("submodules/" + match.group(1)):
                      print(f"REMOVED from {cmake_file.name}: {match.group(1)}")
                      continue
                  kept.append(line)
              cmake_file.write_text("".join(kept))
          print("Selesai memeriksa file sumber.")
          PY

      - name: Build
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash ./build.sh ${{ matrix.target_arch }}

      - name: Show checksum
        run: sha256sum build/bin/aapt2-*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aapt2-${{ matrix.target_arch }}
          path: build/bin/aapt2-*
